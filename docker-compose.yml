services:
  mongodb_speakup:
    image: andressantanaf/speakup-mongo:latest
    container_name: mongodb_speakup
    ports:
      - "27018:27017"
    volumes:
      - mongo_data_docker:/data/db

  api_speakup:
    build: ./backend
    image: davidacardozo/speakup-backend:latest
    pull_policy: build
    container_name: api_speakup
    ports:
      - "8084:8083"
    depends_on:
      - mongodb_speakup
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb_speakup:27017/speakup_db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      IA_MODEL: ${IA_MODEL:-qwen/qwen3.8-27b}

  frontend_speakup:
    build: ./frontend
    image: davidacardozo/speakup-frontend:latest
    pull_policy: build
    container_name: frontend_speakup
    ports:
      - "3000:80"
    depends_on:
      - api_speakup
    environment:
      REACT_APP_API_URL: http://localhost:8084/api
      PORT: "80"

volumes:
  mongo_data_docker:
