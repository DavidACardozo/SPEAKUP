spring.application.name=bdpai
server.port=${PORT:8083}
spring.data.mongodb.uri=mongodb://localhost:27017/speakup_db
logging.level.org.springframework.data.mongodb=DEBUG
ia.key=${GROQ_API_KEY:}
ia.model=${IA_MODEL:qwen/qwen3.8-27b}
reciclaje.vision.provider=${RECICLAJE_VISION_PROVIDER:groq}
reciclaje.vision.api-url=${RECICLAJE_VISION_API_URL:https://api.groq.com/openai/v1/chat/completions}
reciclaje.vision.api-key=${RECICLAJE_VISION_API_KEY:${GROQ_API_KEY:${HF_TOKEN:}}}
reciclaje.vision.model=${RECICLAJE_VISION_MODEL:qwen/qwen3.8-27b}
reciclaje.vision.timeout-segundos=${RECICLAJE_VISION_TIMEOUT:60}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
